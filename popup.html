<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 260px;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #313338;
      color: #f2f3f5;
      margin: 0;
    }
    h3 {
      margin: 0 0 12px 0;
      color: #5865f2;
      font-size: 16px;
      text-align: center;
    }
    input {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      background: #1e1f22;
      border: 1px solid #4e5058;
      color: #dbdee1;
      border-radius: 4px;
      font-size: 11px;
      margin-bottom: 10px;
    }
    button {
      width: 100%;
      padding: 9px;
      margin-bottom: 6px;
      background-color: #5865f2;
      color: white;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      font-size: 13px;
    }
    button:active {
      background-color: #4752c4;
    }
    .btn-secondary {
      background-color: #4e5058;
    }
    .btn-secondary:active {
      background-color: #6d6f78;
    }
    #status {
      font-size: 11px;
      color: #b5bac1;
      text-align: center;
      margin-top: 6px;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <h3>Discord Token Viewer</h3>
  <input type="password" id="tokenInput" placeholder="Token will appear here" readonly />
  <button id="getTokenBtn">Get Token</button>
  <button id="copyBtn" class="btn-secondary">Copy Token</button>
  <div id="status">Open discord.com in tab first</div>

  <script src="popup.js"></script>
</body>
</html>
